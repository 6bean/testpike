server:
  port: ${CORE_PORT:8083}

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT_MS:5000}
            readTimeout: ${FEIGN_READ_TIMEOUT_MS:820000}
  application:
    name: testpike-core
  profiles:
    active: dev
  autoconfigure:
    exclude:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/testpike}
    username: ${DB_USERNAME:testpike}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${MQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:testpike}
    password: ${RABBITMQ_PASSWORD:}
    # Hit-ledger consumer: 3 retries then nack(requeue=false) into the dead letter
    # (MockHitQueueConfig DLX topology, same baseline as the ai-service queues);
    # an infinite requeue storm is the forbidden alternative.
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:8333}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  bucket: ${S3_BUCKET:testpike-exec}
  region: ${S3_REGION:us-east-1}
  path-style: ${S3_PATH_STYLE:true}

storage:
  local:
    public-base-url: ${STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:8081/storage/files}
    sign-secret: ${STORAGE_URL_SIGN_SECRET:}

aiservice:
  base-url: ${AISERVICE_BASE_URL:http://localhost:18084}

testpike:
  prod-blacklist: ${TESTPIKE_PROD_BLACKLIST:}

tp:
  mq:
    deadletter:
      egress:
        enabled: ${TP_DLQ_EGRESS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
