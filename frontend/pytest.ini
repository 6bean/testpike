[pytest]
addopts = -n 4 --dist loadgroup --timeout=180 --durations=20 --durations-min=15
testpaths = tests/e2e
# Signal-based interruption. The thread method cannot interrupt a blocked
# Playwright/httpx call, so a red test kept spinning past its own deadline and
# the whole xdist session stalled (measured: zero CPU and no new progress line
# for 9 minutes while the session was nominally "running").
# Runtime-overridable through TP_E2E_TIMEOUT_S / TP_E2E_TIMEOUT_METHOD
# (applied in tests/e2e/conftest.py pytest_configure), so budgets stay tunable
# without editing this file mid-window.
timeout_method = signal
