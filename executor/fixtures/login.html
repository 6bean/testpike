<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>testPike 试运行演示门户</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 40px; background: #f5f7fa; }
    .card { max-width: 360px; margin: 0 auto; padding: 24px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h2 { text-align: center; color: #333; }
    label { display: block; margin: 12px 0 4px; color: #555; font-size: 14px; }
    input { width: 100%; padding: 8px; border: 1px solid #dcdfe6; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; margin-top: 16px; padding: 9px; background: #c00000; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .welcome { color: #c00000; font-size: 16px; margin-top: 12px; }
    .hint { color: #999; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
<div class="card">
  <h2>试运行演示门户</h2>
  <form id="login-form">
    <label for="username">账号</label>
    <input id="username" name="username" type="text" placeholder="请输入账号">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" placeholder="请输入密码">
    <button id="login-btn" type="submit">登 录</button>
  </form>
  <div id="welcome" class="welcome" style="display:none">登录成功显示欢迎信息</div>
  <div class="hint">testPike F-8 试运行 E2E 目标页（http.server 8899 提供 /login 路由）</div>
</div>
<script>
  // K2 执行器日志：真实页面 console 消息供执行器捕获回传（L4/E2E 断言 console 日志非空）
  console.log('[demo] 演示门户登录页加载完成');
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = document.getElementById('username').value;
    if (u) {
      // tick419 实证：真实 LLM 生成会产出 net.assert（POST */login）步观测登录请求，
      // 纯本地 JS 不发请求=夹具失真（f8/j6 同根因三连败）。登录改为真实发
      // POST /api/login（serve_fixtures 桩回 200），欢迎显示逻辑与请求结果解耦保持原语义。
      try {
        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u })
        }).catch(function () { /* 观测链路失败不影响本地欢迎显示（夹具原语义） */ });
      } catch (err) { /* 同上 */ }
      document.getElementById('welcome').style.display = 'block';
      console.info('[demo] 登录成功，显示欢迎信息');
    }
  });
</script>
</body>
</html>
