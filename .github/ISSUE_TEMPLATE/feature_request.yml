name: Feature request
description: Propose a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: As a ... I cannot ... because ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Preferred shape of the solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
