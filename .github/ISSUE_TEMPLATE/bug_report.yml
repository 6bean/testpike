name: Bug report
description: Report a defect with reproduction steps
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please redact tokens, credentials and production data.
        Security issues: use the private flow in SECURITY.md, not an issue.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment mode
      options: [Docker Compose, Installer (installkit), Bare metal, Cluster]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      render: shell
