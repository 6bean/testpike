name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: Static gates (identity, hygiene, duplication, terms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identity scrub gate
        run: python3 tools/scrub_check.py
      - name: Comment hygiene gate
        run: python3 tools/comment_hygiene.py check --tokens
      - name: Terminology gate
        run: python3 tools/term_lint.py

  java:
    name: Java services (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: static-gates
    strategy:
      fail-fast: false
      matrix:
        module: [core, admin, api, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test
        run: mvn -B -pl common,${{ matrix.module }} -am test

  frontend:
    name: Web console
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Type-check
        run: npm run type-check
        working-directory: frontend
      - name: Unit tests
        run: npm run test:unit
        working-directory: frontend
      - name: Build
        run: npx vite build
        working-directory: frontend

  python:
    name: Executor & installer
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python sources
        run: |
          python3 - <<'EOF'
          import pathlib, py_compile, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.py"):
              if any(seg in p.parts for seg in ("node_modules", "target", "dist", ".venv")):
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as exc:
                  bad.append(f"{p}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("python compile: all sources OK")
          EOF
      - name: Installer unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest installkit/tests -q
