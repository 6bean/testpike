name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: Static gates (identity, hygiene, duplication, terms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identity scrub gate
        run: python3 tools/scrub_check.py
      - name: Comment hygiene gate
        run: python3 tools/comment_hygiene.py check --tokens
      - name: Terminology gate
        run: python3 tools/term_lint.py

  java:
    name: Java services (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: static-gates
    strategy:
      fail-fast: false
      matrix:
        module: [core, admin, api, ai-service]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: testpike
          POSTGRES_USER: testpike
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U testpike -d testpike"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: testpike
          RABBITMQ_DEFAULT_PASS: testpike
          RABBITMQ_DEFAULT_VHOST: /
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      seaweedfs:
        image: chrislusf/seaweedfs:4.04
        ports:
          - 8333:8333
        command: "server -s3 -dir=/tmp/s3 -ip=0.0.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Load fresh-install schema into CI postgres
        run: |
          CID=$(docker ps --format '{{.ID}} {{.Image}}' | awk '/pgvector/ {print $1; exit}')
          until docker exec "$CID" pg_isready -U testpike -d testpike >/dev/null 2>&1; do sleep 2; done
          cat db/schema-init.sql | docker exec -i "$CID" psql -U testpike -d testpike -q -v ON_ERROR_STOP=1
          echo "schema-init loaded: $(docker exec "$CID" psql -U testpike -d testpike -At -c 'select count(*) from information_schema.tables where table_schema=$$public$$') tables"
      - name: Install OCR worker dependencies
        if: matrix.module == 'ai-service'
        run: python3 -m pip install --quiet rapidocr-onnxruntime opencv-python-headless numpy
      - name: Compile and test
        env:
          # Throwaway credentials for the ephemeral CI broker above - not a secret.
          RABBITMQ_PASSWORD: testpike
          # Factory demo values already published in .env.example (throwaway CI creds).
          S3_ENDPOINT: http://localhost:8333
          S3_ACCESS_KEY: testpike
          S3_SECRET_KEY: testpike_dev
          S3_BUCKET: testpike-exec
          S3_REGION: us-east-1
          S3_PATH_STYLE: "true"
        run: mvn -B -pl common,${{ matrix.module }} -am
             -Daether.connector.http.retryHandler.count=5
             -Daether.connector.http.retryHandler.serviceUnavailable=429,502,503,504
             test

  frontend:
    name: Web console
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Type-check
        run: npm run type-check
        working-directory: frontend
      - name: Unit tests
        run: npm run test:unit
        working-directory: frontend
      - name: Build
        run: npx vite build
        working-directory: frontend

  python:
    name: Executor & installer
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python sources
        run: |
          python3 - <<'EOF'
          import pathlib, py_compile, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.py"):
              if any(seg in p.parts for seg in ("node_modules", "target", "dist", ".venv")):
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as exc:
                  bad.append(f"{p}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("python compile: all sources OK")
          EOF
      - name: Provision the dev-named postgres the migration tests exec into
        run: |
          docker run -d --name testpike-postgres -p 127.0.0.1:15432:5432 \
            -e POSTGRES_DB=testpike -e POSTGRES_USER=testpike -e POSTGRES_HOST_AUTH_METHOD=trust \
            pgvector/pgvector:pg16
          until docker exec testpike-postgres pg_isready -U testpike >/dev/null 2>&1; do sleep 2; done
      - name: Installer unit tests
        env:
          DB_URL: jdbc:postgresql://localhost:15432/testpike
        run: |
          python3 -m pip install --quiet -r installkit/requirements.txt -r installkit/requirements-dev.txt
          python3 -m pytest installkit/tests -q
