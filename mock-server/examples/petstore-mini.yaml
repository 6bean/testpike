openapi: 3.0.3
info:
  title: Petstore Mini
  version: 1.0.0
  description: Small sample API for trying the mock server.
paths:
  /pets:
    get:
      summary: List all pets
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              example:
                - id: 1
                  name: Tommy
                  tag: dog
                - id: 2
                  name: Kitty
                  tag: cat
    post:
      summary: Add a new pet
      requestBody:
        content:
          application/json:
            example:
              name: Bruno
              tag: dog
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              example:
                id: 3
                name: Bruno
                tag: dog
  /pets/{petId}:
    get:
      summary: Get a pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A single pet
          content:
            application/json:
              example:
                id: 1
                name: Tommy
                tag: dog
        "404":
          description: Pet not found
          content:
            application/json:
              example:
                error: Pet not found
    delete:
      summary: Delete a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Pet deleted
